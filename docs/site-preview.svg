<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="'Space Grotesk',system-ui,sans-serif">
  <defs>
    <radialGradient id="g1" cx="82%" cy="12%" r="42%"><stop offset="0%" stop-color="#22B8CF" stop-opacity="0.14"/><stop offset="60%" stop-color="#22B8CF" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="10%" cy="82%" r="42%"><stop offset="0%" stop-color="#D8362B" stop-opacity="0.14"/><stop offset="60%" stop-color="#D8362B" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3" cx="60%" cy="58%" r="45%"><stop offset="0%" stop-color="#1574D6" stop-opacity="0.10"/><stop offset="60%" stop-color="#1574D6" stop-opacity="0"/></radialGradient>
    <filter id="ds" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>

  <rect width="1200" height="750" fill="#0E0F11"/>
  <rect width="1200" height="750" fill="url(#g1)"/>
  <rect width="1200" height="750" fill="url(#g2)"/>
  <rect width="1200" height="750" fill="url(#g3)"/>

  <!-- brick helper drawings -->
  <!-- RED top-left -->
  <g transform="translate(70,80) scale(1.25)" filter="url(#ds)">
    <ellipse cx="33" cy="13" rx="9" ry="5" fill="#D8362B"/><ellipse cx="63" cy="13" rx="9" ry="5" fill="#D8362B"/>
    <polygon points="18,18 78,18 60,36 0,36" fill="#D8362B"/><polygon points="18,18 78,18 60,36 0,36" fill="#fff" opacity="0.1"/>
    <polygon points="0,36 60,36 60,70 0,70" fill="#D8362B"/><polygon points="0,36 60,36 60,70 0,70" fill="#000" opacity="0.16"/>
    <polygon points="60,36 78,18 78,52 60,70" fill="#D8362B"/><polygon points="60,36 78,18 78,52 60,70" fill="#000" opacity="0.34"/>
  </g>
  <!-- YELLOW top-right -->
  <g transform="translate(1010,120) scale(1.1)" filter="url(#ds)">
    <ellipse cx="33" cy="13" rx="9" ry="5" fill="#FFC500"/><ellipse cx="63" cy="13" rx="9" ry="5" fill="#FFC500"/><ellipse cx="93" cy="13" rx="9" ry="5" fill="#FFC500"/>
    <polygon points="18,18 108,18 90,36 0,36" fill="#FFC500"/><polygon points="18,18 108,18 90,36 0,36" fill="#fff" opacity="0.12"/>
    <polygon points="0,36 90,36 90,70 0,70" fill="#FFC500"/><polygon points="0,36 90,36 90,70 0,70" fill="#000" opacity="0.14"/>
    <polygon points="90,36 108,18 108,52 90,70" fill="#FFC500"/><polygon points="90,36 108,18 108,52 90,70" fill="#000" opacity="0.32"/>
  </g>
  <!-- BLUE bottom-left -->
  <g transform="translate(110,600) scale(1.1)" filter="url(#ds)">
    <ellipse cx="33" cy="13" rx="9" ry="5" fill="#1574D6"/><ellipse cx="63" cy="13" rx="9" ry="5" fill="#1574D6"/>
    <polygon points="18,18 78,18 60,36 0,36" fill="#1574D6"/><polygon points="18,18 78,18 60,36 0,36" fill="#fff" opacity="0.12"/>
    <polygon points="0,36 60,36 60,70 0,70" fill="#1574D6"/><polygon points="0,36 60,36 60,70 0,70" fill="#000" opacity="0.16"/>
    <polygon points="60,36 78,18 78,52 60,70" fill="#1574D6"/><polygon points="60,36 78,18 78,52 60,70" fill="#000" opacity="0.34"/>
  </g>
  <!-- GREEN bottom-right -->
  <g transform="translate(1040,610) scale(1.05)" filter="url(#ds)">
    <ellipse cx="33" cy="13" rx="9" ry="5" fill="#2EA84F"/><ellipse cx="63" cy="13" rx="9" ry="5" fill="#2EA84F"/>
    <polygon points="18,18 78,18 60,36 0,36" fill="#2EA84F"/>
    <polygon points="0,36 60,36 60,70 0,70" fill="#2EA84F"/><polygon points="0,36 60,36 60,70 0,70" fill="#000" opacity="0.16"/>
    <polygon points="60,36 78,18 78,52 60,70" fill="#2EA84F"/><polygon points="60,36 78,18 78,52 60,70" fill="#000" opacity="0.34"/>
  </g>

  <!-- astronaut top -->
  <g transform="translate(560,40) scale(0.95)" filter="url(#ds)">
    <ellipse cx="60" cy="12" rx="11" ry="6" fill="#F4F1EA"/><rect x="30" y="16" width="60" height="52" rx="16" fill="#F4F1EA"/>
    <rect x="38" y="30" width="44" height="26" rx="11" fill="#FFC500"/><rect x="38" y="30" width="44" height="13" rx="8" fill="#fff" opacity="0.35"/>
    <rect x="26" y="34" width="7" height="16" rx="3" fill="#D8362B"/><rect x="87" y="34" width="7" height="16" rx="3" fill="#D8362B"/>
    <rect x="36" y="74" width="48" height="8" rx="4" fill="#9aa0a6"/><rect x="34" y="78" width="52" height="44" rx="9" fill="#F4F1EA"/>
    <rect x="50" y="90" width="20" height="16" rx="3" fill="#D8362B"/><rect x="22" y="82" width="14" height="34" rx="7" fill="#F4F1EA"/><rect x="84" y="82" width="14" height="34" rx="7" fill="#F4F1EA"/>
    <circle cx="29" cy="120" r="7" fill="#FFC500"/><circle cx="91" cy="120" r="7" fill="#FFC500"/>
    <rect x="40" y="120" width="18" height="26" rx="4" fill="#3a3d42"/><rect x="62" y="120" width="18" height="26" rx="4" fill="#3a3d42"/>
  </g>

  <!-- spaceship flying -->
  <g transform="translate(760,470) scale(1.15)" filter="url(#ds)">
    <polygon points="22,40 -6,48 22,56" fill="#FF7A1A"/><polygon points="22,43 6,48 22,53" fill="#FFC500"/>
    <rect x="18" y="34" width="16" height="28" rx="4" fill="#9aa0a6"/>
    <polygon points="74,32 96,6 110,32" fill="#FFC500"/><polygon points="74,64 96,90 110,64" fill="#FFC500"/><polygon points="74,64 96,90 110,64" fill="#000" opacity="0.16"/>
    <rect x="30" y="30" width="120" height="36" rx="17" fill="#E8E6DF"/><rect x="30" y="48" width="120" height="18" rx="9" fill="#000" opacity="0.08"/>
    <rect x="64" y="44" width="58" height="7" rx="3.5" fill="#D8362B" opacity="0.85"/>
    <path d="M150 30 Q196 48 150 66 Z" fill="#D8362B"/>
    <circle cx="118" cy="48" r="12" fill="#22B8CF"/><circle cx="114" cy="44" r="4.5" fill="#fff" opacity="0.45"/>
  </g>

  <!-- sample content plate to show text legibility -->
  <g transform="translate(330,300)">
    <rect x="0" y="0" width="540" height="190" rx="16" fill="#1C1E22"/>
    <rect x="0" y="0" width="540" height="190" rx="16" fill="#fff" opacity="0.03"/>
    <g transform="translate(28,34)"><rect width="12" height="12" rx="6" fill="#D8362B"/><rect x="22" width="12" height="12" rx="6" fill="#FFC500"/><rect x="44" width="12" height="12" rx="6" fill="#1574D6"/></g>
    <text x="28" y="92" font-size="40" font-weight="700" fill="#F4F1EA" letter-spacing="-1.5">Kambiz Akhbari</text>
    <text x="28" y="130" font-size="19" fill="#F4F1EA" opacity="0.72">Fashion photography, film, and art direction</text>
    <text x="28" y="158" font-size="19" fill="#F4F1EA" opacity="0.72">from Istanbul.</text>
  </g>

  <text x="600" y="725" font-size="14" fill="#F4F1EA" opacity="0.4" text-anchor="middle">Whole site is now dark. The bricks and astronauts bob and spin, spaceships fly across, text sits on clean plates.</text>
</svg>
