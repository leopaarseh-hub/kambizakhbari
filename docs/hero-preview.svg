<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Space Grotesk',system-ui,sans-serif">
  <defs>
    <radialGradient id="glowA" cx="78%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#22B8CF" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#22B8CF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="12%" cy="88%" r="55%">
      <stop offset="0%" stop-color="#D8362B" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#D8362B" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ink stage -->
  <rect width="1200" height="675" fill="#121213"/>
  <rect width="1200" height="675" fill="url(#glowA)"/>
  <rect width="1200" height="675" fill="url(#glowB)"/>

  <!-- ===== reusable iso bricks ===== -->
  <!-- RED 2-stud, top-left -->
  <g transform="translate(120,150) scale(1.4)" filter="url(#ds)">
    <ellipse cx="33" cy="13" rx="9" ry="5" fill="#D8362B"/>
    <ellipse cx="63" cy="13" rx="9" ry="5" fill="#D8362B"/>
    <ellipse cx="33" cy="11" rx="6" ry="3" fill="#fff" opacity="0.18"/>
    <ellipse cx="63" cy="11" rx="6" ry="3" fill="#fff" opacity="0.18"/>
    <polygon points="18,18 78,18 60,36 0,36" fill="#D8362B"/>
    <polygon points="18,18 78,18 60,36 0,36" fill="#fff" opacity="0.10"/>
    <polygon points="0,36 60,36 60,70 0,70" fill="#D8362B"/>
    <polygon points="0,36 60,36 60,70 0,70" fill="#000" opacity="0.16"/>
    <polygon points="60,36 78,18 78,52 60,70" fill="#D8362B"/>
    <polygon points="60,36 78,18 78,52 60,70" fill="#000" opacity="0.34"/>
  </g>

  <!-- YELLOW 3-stud, mid-right -->
  <g transform="translate(760,250) scale(1.2)" filter="url(#ds)">
    <ellipse cx="33" cy="13" rx="9" ry="5" fill="#FFC500"/>
    <ellipse cx="63" cy="13" rx="9" ry="5" fill="#FFC500"/>
    <ellipse cx="93" cy="13" rx="9" ry="5" fill="#FFC500"/>
    <polygon points="18,18 108,18 90,36 0,36" fill="#FFC500"/>
    <polygon points="18,18 108,18 90,36 0,36" fill="#fff" opacity="0.12"/>
    <polygon points="0,36 90,36 90,70 0,70" fill="#FFC500"/>
    <polygon points="0,36 90,36 90,70 0,70" fill="#000" opacity="0.14"/>
    <polygon points="90,36 108,18 108,52 90,70" fill="#FFC500"/>
    <polygon points="90,36 108,18 108,52 90,70" fill="#000" opacity="0.32"/>
  </g>

  <!-- BLUE 2-stud, bottom-right -->
  <g transform="translate(880,470) scale(1.3)" filter="url(#ds)">
    <ellipse cx="33" cy="13" rx="9" ry="5" fill="#1574D6"/>
    <ellipse cx="63" cy="13" rx="9" ry="5" fill="#1574D6"/>
    <polygon points="18,18 78,18 60,36 0,36" fill="#1574D6"/>
    <polygon points="18,18 78,18 60,36 0,36" fill="#fff" opacity="0.12"/>
    <polygon points="0,36 60,36 60,70 0,70" fill="#1574D6"/>
    <polygon points="0,36 60,36 60,70 0,70" fill="#000" opacity="0.16"/>
    <polygon points="60,36 78,18 78,52 60,70" fill="#1574D6"/>
    <polygon points="60,36 78,18 78,52 60,70" fill="#000" opacity="0.34"/>
  </g>

  <!-- GREEN small, bottom-left -->
  <g transform="translate(430,520) scale(1.0)" filter="url(#ds)">
    <ellipse cx="33" cy="13" rx="9" ry="5" fill="#2EA84F"/>
    <ellipse cx="63" cy="13" rx="9" ry="5" fill="#2EA84F"/>
    <polygon points="18,18 78,18 60,36 0,36" fill="#2EA84F"/>
    <polygon points="0,36 60,36 60,70 0,70" fill="#2EA84F"/>
    <polygon points="0,36 60,36 60,70 0,70" fill="#000" opacity="0.16"/>
    <polygon points="60,36 78,18 78,52 60,70" fill="#2EA84F"/>
    <polygon points="60,36 78,18 78,52 60,70" fill="#000" opacity="0.34"/>
  </g>

  <!-- ===== astronaut minifigure, top-right ===== -->
  <g transform="translate(980,70) scale(1.15)" filter="url(#ds)">
    <ellipse cx="60" cy="12" rx="11" ry="6" fill="#F4F1EA"/>
    <rect x="30" y="16" width="60" height="52" rx="16" fill="#F4F1EA"/>
    <rect x="38" y="30" width="44" height="26" rx="11" fill="#FFC500"/>
    <rect x="38" y="30" width="44" height="13" rx="8" fill="#fff" opacity="0.35"/>
    <rect x="26" y="34" width="7" height="16" rx="3" fill="#D8362B"/>
    <rect x="87" y="34" width="7" height="16" rx="3" fill="#D8362B"/>
    <rect x="50" y="66" width="20" height="8" rx="3" fill="#F4F1EA"/>
    <rect x="36" y="74" width="48" height="8" rx="4" fill="#9aa0a6"/>
    <rect x="34" y="78" width="52" height="44" rx="9" fill="#F4F1EA"/>
    <rect x="50" y="90" width="20" height="16" rx="3" fill="#D8362B"/>
    <circle cx="56" cy="98" r="2.4" fill="#fff"/>
    <circle cx="64" cy="98" r="2.4" fill="#FFC500"/>
    <rect x="22" y="82" width="14" height="34" rx="7" fill="#F4F1EA"/>
    <rect x="84" y="82" width="14" height="34" rx="7" fill="#F4F1EA"/>
    <circle cx="29" cy="120" r="7" fill="#FFC500"/>
    <circle cx="91" cy="120" r="7" fill="#FFC500"/>
    <rect x="40" y="120" width="18" height="26" rx="4" fill="#3a3d42"/>
    <rect x="62" y="120" width="18" height="26" rx="4" fill="#3a3d42"/>
  </g>

  <!-- ===== headline ===== -->
  <g transform="translate(110,300)">
    <g>
      <rect x="0" y="0" width="14" height="14" rx="7" fill="#D8362B"/>
      <rect x="26" y="0" width="14" height="14" rx="7" fill="#FFC500"/>
      <rect x="52" y="0" width="14" height="14" rx="7" fill="#1574D6"/>
    </g>
    <text x="0" y="110" font-size="104" font-weight="700" fill="#F4F1EA" letter-spacing="-3">Kambiz</text>
    <text x="0" y="210" font-size="104" font-weight="700" fill="#F4F1EA" letter-spacing="-3">Akhbari</text>
    <text x="4" y="262" font-size="26" fill="#F4F1EA" opacity="0.72">Fashion photography, film, and art direction from Istanbul.</text>
  </g>

  <text x="1140" y="650" font-size="14" fill="#F4F1EA" opacity="0.4" text-anchor="end">Static preview of the animated hero. Bricks and astronauts drift and bob in the live site.</text>
</svg>
